<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Live tracker | Parlay of the Day</title>
<link rel="icon" href="/favicon.ico?v=1" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Outfit:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/live.css?v=15"/>
</head>
<body>
<header class="live-top">
  <a class="live-home" href="/" aria-label="Back to Parlay of the Day"><img src="/scene/wordmark.png?v=4" alt="Parlay of the Day"/></a>
  <h1>Live tracker</h1>
  <span id="live-score" class="live-score"></span>
  <label class="live-court"><input type="checkbox" id="live-recs"/> Recommended bets</label>
  <label class="live-court live-court-next"><input type="checkbox" id="live-court"/> On court only</label>
  <label class="live-court live-court-next"><input type="checkbox" id="live-all"/> All of today</label>
  <span id="live-at" class="live-at"></span>
  <a class="live-bird" href="/" aria-label="Back to Parlay of the Day"><span><img src="/scene/parrot.png" alt=""/></span></a>
</header>
<main id="live"><p class="live-note">Loading live games.</p></main>
<a id="live-profile" href="/?go=profile" aria-label="Profile"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.2"/><path d="M5 19c1.5-3.1 4-4.6 7-4.6s5.5 1.5 7 4.6"/></svg></a>
<script src="/live.js?v=16"></script>
</body>
</html>
