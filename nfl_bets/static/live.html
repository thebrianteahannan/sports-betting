<header class="live-top">
  <button type="button" id="live-back" aria-label="Back" title="Back" onclick="if (document.referrer.startsWith(location.origin) && history.length > 1) history.back(); else location.href = '/';"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button>
  <a class="live-home" href="/" aria-label="Back to Parlay of the Day"><img src="/scene/wordmark.webp?v=1" alt="Parlay of the Day"/></a>
  <h1>The Games</h1>
  <span id="live-score" class="live-score"></span>
  <a class="live-build" href="/?go=find">My Bets</a>
  <span id="live-at" class="live-at"></span>
  <a class="live-bird" href="/" aria-label="Back to Parlay of the Day"><span><img src="/scene/parrot.webp?v=1" alt=""/></span></a>
</header>
<main id="live"><div class="live-load"><img src="/scene/parrot-head.webp?v=1" alt=""/><div class="live-load-say" aria-label="Loading past, present, and future games."><p></p><p></p><p></p></div></div></main>
<script>
(() => {
  const lines = ["Pulling last night's finals.", "Checking the games on now.", "Lining up what's coming next."], rows = [...document.querySelectorAll(".live-load-say p")];
  let line = 0, at = 0;
  const tick = () => {
    const row = rows[line];
    if (!row || !row.isConnected) return;
    row.classList.add("on");
    row.textContent = lines[line].slice(0, ++at);
    if (at < lines[line].length) { setTimeout(tick, 28); return; }
    if (line === lines.length - 1) return;
    row.classList.replace("on", "done");
    line += 1; at = 0;
    setTimeout(tick, 350);
  };
  tick();
})();
</script>
